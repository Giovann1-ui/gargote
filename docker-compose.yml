# Facultatif : lance PostgreSQL dans Docker si vous ne l'avez pas installé.
#   docker compose up -d
# Les scripts du dossier database/ sont exécutés au premier démarrage.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gargote
      POSTGRES_PASSWORD: gargote
      POSTGRES_DB: gargote
    ports:
      - "5432:5432"
    volumes:
      # Monte tout le dossier database pour que l'entrypoint puisse lire tous les scripts
      - ./database:/docker-entrypoint-initdb.d:ro